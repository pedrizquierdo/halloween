name: Pruebas

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root_test
          MYSQL_DATABASE: halloween_test
          MYSQL_USER: halloween_test
          MYSQL_PASSWORD: halloween_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_NAME: halloween_test
      DB_USER: halloween_test
      DB_PASSWORD: halloween_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - run: python -m pip install -r requirements.txt

      - name: Crear tabla monster
        run: |
          mysql -h "$DB_HOST" -P "$DB_PORT" -u "$DB_USER" -p"$DB_PASSWORD" "$DB_NAME" -e "
            CREATE TABLE monster (
              id INT AUTO_INCREMENT PRIMARY KEY,
              name VARCHAR(100) NOT NULL,
              power VARCHAR(100) NOT NULL
            );"

      - run: python -m unittest -v
