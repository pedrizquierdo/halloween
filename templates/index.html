<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monsters</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <div class="jumpscare" id="jumpscare">
        <img data-src="{{ url_for('static', filename='img/jumpscare.gif') }}" alt="">
    </div>

    <script>
        (function () {
            const overlay = document.getElementById('jumpscare');
            try {
                if (sessionStorage.getItem('jumpscared')) {
                    overlay.hidden = true;
                    return;
                }
                sessionStorage.setItem('jumpscared', '1');
            } catch (e) {}

            function scream() {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const ctx = new AudioCtx();
                ctx.resume();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(900, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(180, ctx.currentTime + 1.2);
                gain.gain.setValueAtTime(0.4, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.3);
                osc.connect(gain).connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 1.3);
            }

            function hide() {
                if (overlay.classList.contains('fade-out')) return;
                overlay.classList.add('fade-out');
                setTimeout(function () { overlay.hidden = true; }, 600);
            }

            // One full loop of the GIF (it starts on the black frame), so the fade begins as it returns there.
            const GIF_LOOP_MS = 4000;
            const img = overlay.querySelector('img');

            // The overlay is black from the first paint; animations start once the GIF has loaded
            // so the timer lines up with its first frame.
            img.addEventListener('load', function () {
                overlay.classList.add('playing');
                scream();
                overlay.addEventListener('click', hide);
                setTimeout(hide, GIF_LOOP_MS);
            }, { once: true });
            img.addEventListener('error', hide, { once: true });
            img.src = img.dataset.src;
        })();
    </script>

    <div class="container">
        <h1>Halloween Monsters by cozcatl</h1>

        <form action="/monster" method="post">
            <label>Nombre <input type="text" name="name" required></label>
            <label>Poder <input type="text" name="power" required></label>
            <button type="submit">Agregar</button>
        </form>

        <table>
            <tr>
                <th>Nombre</th>
                <th>Poder</th>
                <th>Historia</th>
            </tr>
            {% for monster in monsters %}
            <tr>
                <td>{{ monster.name }}</td>
                <td>{{ monster.power }}</td>
                <td>{{ monster.history }}</td>
            </tr>
            {% endfor %}
        </table>
    </div>
</body>
</html>
